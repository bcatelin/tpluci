[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tpluci"
version = "0.1.0"
description = "Pure Python CLI and MCP server for TP-Link Archer LuCI routers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Benoit Catelin" },
]
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0,<=48.0.1",
    "python-dotenv>=1.0.0",
    "keyring>=25.0.0",
    "mcp>=1.0.0,<2.0.0",
]

[project.scripts]
tpluci = "tpluci.cli:main"
tpluci-mcp = "tpluci.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
